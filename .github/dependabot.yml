# PRs target dev (the integration branch), not the default branch.
# Monthly, with low PR limits, to keep review load small.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # vitest and @vitest/coverage-v8 must share a version, or npm ci fails.
      vitest:
        patterns: [vitest, "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
