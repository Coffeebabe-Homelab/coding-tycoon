# Filenames in /assets are content-hashed, so they can be cached for good. Everything
# else, index.html above all, must revalidate so a deploy reaches browsers immediately.
# An empty value sends no header, which leaves caching of /api/ to the backend.
map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep add_header out of the location blocks: one there would drop all of these.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Re-resolve via Docker DNS so a recreated backend container (new IP)
        # doesn't leave nginx proxying to a stale address (502 Connection refused).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        # No URI part on the variable: nginx forwards the original request URI unchanged.
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
