services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codingtycoon}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-codingtycoon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-coding-tycoon-backend}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-homelab}
      QUARKUS_PROFILE: prod
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-codingtycoon}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?AUTH0_DOMAIN is required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?AUTH0_AUDIENCE is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # No depends_on ollama: with Ollama down the backend still starts and serves seed tasks.
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-coder:6.7b-instruct-q4_K_M}
      AI_TASK_TIMEOUT_SECONDS: ${AI_TASK_TIMEOUT_SECONDS:-50}
      # Review timing, tuned on staging (see docs/STAGING_DEPLOY.md). Defaults match application.properties.
      CODINGTYCOON_REVIEW_TARGET_DURATION: ${CODINGTYCOON_REVIEW_TARGET_DURATION:-30s}
      CODINGTYCOON_REVIEW_TIMEOUT: ${CODINGTYCOON_REVIEW_TIMEOUT:-5m}
      CODINGTYCOON_REVIEW_MAX_FAILURES: ${CODINGTYCOON_REVIEW_MAX_FAILURES:-3}
      CODINGTYCOON_REVIEW_RETRY_BACKOFF: ${CODINGTYCOON_REVIEW_RETRY_BACKOFF:-30s}
      CODINGTYCOON_REVIEW_STUCK_AFTER: ${CODINGTYCOON_REVIEW_STUCK_AFTER:-10m}
      CODINGTYCOON_REVIEW_POLL_INTERVAL: ${CODINGTYCOON_REVIEW_POLL_INTERVAL:-5s}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:?VITE_AUTH0_DOMAIN is required}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:?VITE_AUTH0_CLIENT_ID is required}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:?VITE_AUTH0_AUDIENCE is required}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  lgtm:
    image: grafana/otel-lgtm:0.39.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data

  # Model server for the AI ports. No published port: only the backend reaches it.
  # The model is pulled once onto the volume (docs/STAGING_DEPLOY.md), never at startup.
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      # CPU only: one model call at a time; more would just queue inside Ollama.
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The image has no curl or wget; the CLI talks to the local server.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  lgtm-data:
  postgres_data:
  ollama_data: