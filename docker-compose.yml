services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codingtycoon
      POSTGRES_USER: ${DB_USER:-codingtycoon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codingtycoon}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codingtycoon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pulls DeepSeek-Coder 6.7B Q4_K_M on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull deepseek-coder:6.7b-instruct-q4_K_M && wait"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  ollama_data:
