# Random port, so a concurrent run or another local service on 8081 can't fail the boot.
quarkus.http.test-port=0

# Test profile: real PostgreSQL via Dev Services, so Docker must be running.
# Same major version as docker-compose.yml. Flyway builds the schema, as in prod.
quarkus.datasource.devservices.image-name=postgres:16

# Keep the data the JaCoCo agent wrote for plain unit tests, so the report covers both kinds of test.
quarkus.jacoco.reuse-data-file=true

# OIDC stays enabled, as in prod, against the local OidcWiremockTestResource stub
# (see OidcTokenValidationTest). @TestSecurity + @OidcSecurity inject an identity for other tests.
quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus/
quarkus.oidc.client-id=quarkus-service-app
quarkus.oidc.token.audience=https://service.example.com
# keycloak.url only exists once the stub runs, so the build sees no server URL and would start Keycloak.
quarkus.keycloak.devservices.enabled=false

# CI and tests never need Ollama or a model download.
quarkus.langchain4j.ollama.devservices.enabled=false
