# Test profile — disables Dev Services so tests run without Docker
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.db-kind=h2

# OIDC: disable real OIDC validation; @TestSecurity injects a mock principal instead.
# quarkus-test-security-jwt handles JWT injection for @JwtSecurity.
quarkus.oidc.enabled=false
quarkus.smallrye-jwt.enabled=true
