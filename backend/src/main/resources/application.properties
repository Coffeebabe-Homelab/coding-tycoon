# =============================================================================
# Coding Tycoon — Backend Configuration
# =============================================================================

# --- HTTP ---
quarkus.http.port=8080

# --- CORS ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# --- Database ---
# Dev/test: Quarkus Dev Services starts PostgreSQL automatically (Testcontainers)
quarkus.datasource.db-kind=postgresql
# Dev: let Flyway manage the schema so seed data (V5) is always present
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# Prod: explicit DB URL (set via env vars)
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.database.generation=validate

# --- AI: Ollama (DeepSeek-Coder 6.7B Q4_K_M) ---
# No Dev Services: Ollama runs as its own Compose service, never started by the backend.
quarkus.langchain4j.ollama.devservices.enabled=false
# Which AI backs every AI port: stub (no AI, seed content) or ollama. One image, chosen at runtime.
codingtycoon.ai.provider=${AI_PROVIDER:stub}
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:deepseek-coder:6.7b-instruct-q4_K_M}
%dev.quarkus.langchain4j.ollama.log-requests=true
%dev.quarkus.langchain4j.ollama.log-responses=true

# --- Auth: OIDC (Auth0 JWT validation) ---
quarkus.oidc.auth-server-url=https://${AUTH0_DOMAIN}/
quarkus.oidc.client-id=${AUTH0_AUDIENCE}
quarkus.oidc.token.audience=${AUTH0_AUDIENCE}
quarkus.oidc.application-type=service

# --- Logging ---
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."dev.codingtycoon".level=DEBUG

# --- OpenTelemetry (signals enabled at build time) ---
quarkus.otel.traces.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.service.name=${OTEL_SERVICE_NAME:coding-tycoon-backend}
quarkus.otel.resource.attributes=deployment.environment=${DEPLOYMENT_ENVIRONMENT:dev}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}
# Tests must not depend on an external collector.
%test.quarkus.otel.sdk.disabled=true
