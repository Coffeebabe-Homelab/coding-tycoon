# =============================================================================
# Coding Tycoon — Backend Configuration
# =============================================================================

# --- HTTP ---
quarkus.http.port=8080

# --- CORS (allow frontend dev server) ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Database ---
# Dev/test: Quarkus Dev Services starts PostgreSQL automatically (Testcontainers)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=drop-and-create

# Prod: explicit DB URL (set via env vars)
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/codingtycoon
%prod.quarkus.datasource.username=${DB_USER:codingtycoon}
%prod.quarkus.datasource.password=${DB_PASSWORD:codingtycoon}
%prod.quarkus.hibernate-orm.database.generation=validate

# --- AI: Ollama (DeepSeek-Coder 6.7B Q4_K_M) ---
# NOTE: quarkus-langchain4j-ollama deferred to Phase 3 (version compatibility).
# Uncomment when the extension is added back:
# quarkus.langchain4j.ollama.base-url=http://localhost:11434
# quarkus.langchain4j.ollama.chat-model.model-id=deepseek-coder:6.7b-instruct-q4_K_M
# quarkus.langchain4j.ollama.chat-model.timeout=120s
# quarkus.langchain4j.ollama.log-requests=true
# quarkus.langchain4j.ollama.log-responses=true

# --- Auth: OIDC (Auth0 JWT validation) ---
quarkus.oidc.auth-server-url=https://${AUTH0_DOMAIN:placeholder.auth0.com}/
quarkus.oidc.client-id=${AUTH0_AUDIENCE:https://api.codingtycoon.dev}
quarkus.oidc.token.audience=${AUTH0_AUDIENCE:https://api.codingtycoon.dev}
quarkus.oidc.application-type=service

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."dev.codingtycoon".level=DEBUG
